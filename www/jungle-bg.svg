<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a13"/>
      <stop offset="0.55" stop-color="#0b2419"/>
      <stop offset="1" stop-color="#06160f"/>
    </linearGradient>

    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f2b"/>
      <stop offset="1" stop-color="#0d2b1d"/>
    </linearGradient>

    <linearGradient id="leaf2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4931"/>
      <stop offset="1" stop-color="#102f21"/>
    </linearGradient>

    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Reusable subtle leaf -->
    <g id="leafShape">
      <path d="M0 0 C45-95 125-130 190-125 C160-50 105 20 0 0Z"
            fill="url(#leaf)"/>
      <path d="M4-3 C62-30 116-72 172-117"
            fill="none" stroke="#28583d" stroke-width="3" opacity=".45"/>
      <path d="M50-27 L42-72 M84-49 L78-91 M119-74 L118-105"
            fill="none" stroke="#28583d" stroke-width="2" opacity=".25"/>
    </g>

    <g id="smallLeaf">
      <path d="M0 0 C25-55 70-75 105-73 C90-30 55 5 0 0Z"
            fill="url(#leaf2)"/>
      <path d="M3-2 C38-20 68-42 96-68"
            fill="none" stroke="#315f45" stroke-width="2" opacity=".35"/>
    </g>
  </defs>

  <!-- Base -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Very subtle atmospheric shapes -->
  <g opacity=".18" filter="url(#soft)">
    <ellipse cx="280" cy="180" rx="300" ry="190" fill="#1b5136"/>
    <ellipse cx="1350" cy="680" rx="360" ry="220" fill="#123d29"/>
  </g>

  <!-- Background foliage -->
  <g opacity=".30">
    <g transform="translate(80 230) rotate(-20)">
      <use href="#leafShape"/>
    </g>
    <g transform="translate(1430 190) rotate(155)">
      <use href="#leafShape"/>
    </g>
    <g transform="translate(1300 760) rotate(205) scale(.9)">
      <use href="#leafShape"/>
    </g>
    <g transform="translate(350 820) rotate(-35) scale(.85)">
      <use href="#leafShape"/>
    </g>
  </g>

  <!-- Midground leaves -->
  <g opacity=".20">
    <g transform="translate(520 120) rotate(35) scale(.7)">
      <use href="#leafShape"/>
    </g>
    <g transform="translate(1110 390) rotate(145) scale(.75)">
      <use href="#leafShape"/>
    </g>
    <g transform="translate(760 780) rotate(15) scale(.65)">
      <use href="#leafShape"/>
    </g>
    <g transform="translate(40 650) rotate(170) scale(.6)">
      <use href="#smallLeaf"/>
    </g>
    <g transform="translate(1530 520) rotate(185) scale(.65)">
      <use href="#smallLeaf"/>
    </g>
  </g>

  <!-- Fine foliage accents -->
  <g fill="none" stroke="#28553b" stroke-width="3" opacity=".18">
    <path d="M0 90 C180 180 240 350 180 520"/>
    <path d="M1600 100 C1440 190 1390 350 1450 500"/>
    <path d="M200 900 C330 760 390 650 350 510"/>
    <path d="M1400 900 C1280 790 1230 650 1270 520"/>
  </g>

  <!-- Soft overlay keeps the pattern understated -->
  <rect width="1600" height="900" fill="#06150e" opacity=".18"/>
</svg>
